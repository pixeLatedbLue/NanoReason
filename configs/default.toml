[model]
base_model = "microsoft/Phi-3-mini-4k-instruct"
torch_dtype = "bfloat16"
device_map = "auto"
load_in_4bit = true
trust_remote_code = false

[evaluation]
output_dir = "results"
run_name = "baseline"
few_shot = true

[evaluation.tasks.strategyqa]
dataset = "tasksource/strategy-qa"
split = "train"
max_samples = 500
seed = 42
offset = 0

[evaluation.tasks.gsm8k]
dataset = "gsm8k"
subset = "main"
split = "test"
max_samples = 1319
seed = 42
offset = 0

[evaluation.tasks.mmlu]
dataset = "cais/mmlu"
subset = "all"
split = "test"
max_samples = 14042
seed = 42
offset = 0

[evaluation.tasks.aqua]
dataset = "aqua_rat"
subset = "raw"
split = "test"
max_samples = 254
seed = 42
offset = 0

[sft]
output_dir = "artifacts/sft"
final_dir = "artifacts/sft-final"
dataset = "gsm8k"
subset = "main"
train_split = "train"
extra_datasets = []
validation_fraction = 0.05
seed = 42
max_seq_length = 1024
num_train_epochs = 2.0
per_device_train_batch_size = 4
gradient_accumulation_steps = 4
learning_rate = 0.0002
warmup_ratio = 0.1
logging_steps = 20
eval_steps = 200
save_steps = 500
lora_r = 64
lora_alpha = 128
lora_dropout = 0.05
completion_only = true
response_template = "<|assistant|>"

[grpo]
sft_adapter = "artifacts/sft-final"
output_dir = "artifacts/grpo"
final_dir = "artifacts/grpo-final"
dataset = "gsm8k"
subset = "main"
train_split = "train"
seed = 42
num_train_epochs = 1.0
per_device_train_batch_size = 2
gradient_accumulation_steps = 8
learning_rate = 0.000005
num_generations = 8
max_prompt_length = 512
max_completion_length = 512
beta = 0.04
temperature = 0.9
logging_steps = 10
save_steps = 200
use_process_reward = true
use_diversity_reward = true
model_prm_scale = 1.0
curriculum = true
forgetting_check = true
forgetting_every_steps = 100
forgetting_task = "mmlu"
forgetting_max_samples = 200
