
[model]
base_model = "microsoft/Phi-3-mini-4k-instruct"
torch_dtype = "float16"
device_map = "auto"
load_in_4bit = true
trust_remote_code = false

[evaluation]
output_dir = "/kaggle/working/results"
run_name = "baseline"
few_shot = true

[evaluation.tasks.gsm8k]
dataset = "gsm8k"
subset = "main"
split = "test"
max_samples = 300
seed = 42
offset = 0

[evaluation.tasks.mmlu]
dataset = "cais/mmlu"
subset = "all"
split = "test"
max_samples = 500
seed = 42
offset = 0

[evaluation.tasks.strategyqa]
dataset = "tasksource/strategy-qa"
split = "train"
max_samples = 300
seed = 42
offset = 0

[evaluation.tasks.aqua]
dataset = "aqua_rat"
subset = "raw"
split = "test"
max_samples = 150
seed = 42
offset = 0

[sft]
output_dir = "/kaggle/working/artifacts/sft"
final_dir = "/kaggle/working/artifacts/sft-final"
dataset = "gsm8k"
subset = "main"
train_split = "train"
extra_datasets = []
validation_fraction = 0.05
seed = 42
max_seq_length = 1024
num_train_epochs = 1.0
per_device_train_batch_size = 2
gradient_accumulation_steps = 8
learning_rate = 0.0002
warmup_ratio = 0.1
logging_steps = 20
eval_steps = 200
save_steps = 500
lora_r = 64
lora_alpha = 128
lora_dropout = 0.05
completion_only = true
response_template = "<|assistant|>"
gradient_checkpointing = true
optim = "paged_adamw_8bit"

[grpo]
sft_adapter = "/kaggle/working/artifacts/sft-final"
output_dir = "/kaggle/working/artifacts/grpo"
final_dir = "/kaggle/working/artifacts/grpo-final"
dataset = "gsm8k"
subset = "main"
train_split = "train[:1500]"
seed = 42
num_train_epochs = 1.0
per_device_train_batch_size = 1
gradient_accumulation_steps = 8
learning_rate = 0.000005
num_generations = 2
max_prompt_length = 384
max_completion_length = 128
beta = 0.04
temperature = 0.9
logging_steps = 10
save_steps = 25
gradient_checkpointing = true
optim = "paged_adamw_8bit"
use_process_reward = true
use_diversity_reward = true
model_prm_scale = 1.0
curriculum = true
forgetting_check = true
forgetting_every_steps = 200
forgetting_task = "mmlu"
forgetting_max_samples = 200
